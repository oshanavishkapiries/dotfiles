# ==============================================================================
#  AUTOMATICALLY GENERATED TMUX CONFIGURATION - DEFAULT KEYBINDINGS & MODERN STYLES
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General Settings & Default Keybindings Preserved
# ------------------------------------------------------------------------------
# Default Prefix Key: Ctrl-b (Unmodified)

# ------------------------------------------------------------------------------
# True Color - Protect Neovim colors (must be exact, order matters)
# ------------------------------------------------------------------------------
# Use tmux-256color as the default terminal inside tmux
set -g default-terminal "tmux-256color"
# Pass through 24-bit true color (Tc) to the outer terminal
set -as terminal-overrides ",xterm-256color:Tc"
# Also pass through RGB capability for newer terminals
set -as terminal-overrides ",*:RGB"
# Ensure italics pass through (fixes nvim italic styles)
set -as terminal-overrides ",xterm-256color:sitm=\E[3m:ritm=\E[23m"
# Undercurl support (used by nvim diagnostics)
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# Enable full mouse support (click, scroll, resize)
set -g mouse on

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce latency on ESC key press (vital for Vim / Neovim users)
set -sg escape-time 0

# Increase scrollback history limit
set -g history-limit 50000

# Enable focus events (useful for vim/neovim autoread)
set -g focus-events on

# Quick reload configuration (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message " Config reloaded successfully!"

# ------------------------------------------------------------------------------
# 2. Theme & Styling (Modern Dark Aesthetic - Catppuccin Mocha Inspired)
# ------------------------------------------------------------------------------
# Palette Definition
# Background:  #1e1e2e (Dark Charcoal)
# Surface:     #313244 (Lighter Charcoal)
# Text:        #cdd6f4 (Soft White)
# Subtext:     #a6adc8 (Subtle Grey)
# Accent 1:    #89b4fa (Catppuccin Blue)
# Accent 2:    #cba6f7 (Catppuccin Mauve)
# Accent 3:    #a6e3a1 (Catppuccin Green)
# Accent 4:    #f38ba8 (Catppuccin Red)
# Yellow:      #f9e2af (Catppuccin Yellow)

# Status line positioning & refresh rate
set -g status-position top
set -g status-interval 2
set -g status-justify left

# Status bar general style
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling (e.g. prefix prompt / reload message)
set -g message-style "bg=#313244,fg=#89b4fa,bold"
set -g message-command-style "bg=#313244,fg=#89b4fa,bold"

# Copy mode highlight
setw -g mode-style "bg=#45475a,fg=#cdd6f4,bold"

# ------------------------------------------------------------------------------
# 3. Status Bar Components
# ------------------------------------------------------------------------------
# Left Status: Session Name indicator with accent pill
set -g status-left-length 40
set -g status-left "#[fg=#181825,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#1e1e2e,nobold] "

# Right Status: Host, Time, Date, and Prefix indicator
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#f38ba8]PREFIX #[fg=#313244]│ ,}#[fg=#a6e3a1]󰍹 #H #[fg=#313244]│ #[fg=#f9e2af]󰃭 %Y-%m-%d #[fg=#313244]│ #[fg=#89b4fa,bold]󱑎 %H:%M #[default]"

# Window Tab Format - Unfocused
set -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e] #I: #W "

# Window Tab Format - Focused Active
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #[fg=#1e1e2e,bg=#cba6f7,bold]#I: #W#[fg=#cba6f7,bg=#1e1e2e,nobold]"

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# ------------------------------------------------------------------------------
# 4. OS Clipboard - Auto-copy on select (no keypresses needed)
# ------------------------------------------------------------------------------
# vi keys in copy mode
setw -g mode-keys vi

# AUTO-COPY: When you release mouse drag → instantly copies to OS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# Also copy when double-click selects a word
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# Triple-click selects and copies the whole line
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# Mouse drag starts copy mode automatically
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= "#{pane_in_mode}" "copy-mode -M" "send-keys -M"' 'copy-mode -M'

# Keyboard shortcuts in copy mode (Prefix+[ then v/y)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
bind -T copy-mode-vi Y send-keys -X copy-line
bind -T copy-mode-vi Escape send-keys -X cancel
# Prefix+y to copy current pane's output line
bind y run-shell "tmux show-buffer | xsel --clipboard --input" \; display-message " Copied to clipboard!"
